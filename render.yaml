services:
  # 🧩 PUBLIC: vehicle-proxy-gateway (tämä on sinun nykyinen Node-projekti)
  - type: web
    name: vehicle-proxy-gateway
    runtime: docker
    plan: starter
    region: frankfurt
    autoDeploy: true

    # Nginx ajaa tätä konttia Node.js:n sijaan
    dockerCommand: >
      sh -lc 'cat >/etc/nginx/nginx.conf << "EOF"
      events {}
      http {
        server {
          listen ${PORT};

          # Health check tälle palvelulle
          location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
          }

          location / {
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;

            # 🔗 Forwardataan vcp-coreen sisäverkossa (HTTP)
            proxy_pass http://vcp-core:10000;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          }
        }
      }
      EOF
      exec nginx -g "daemon off;"'

    # Render käyttää /healthz endpointia liveness-testiin
    healthCheckPath: /healthz
