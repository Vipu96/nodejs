services:
  # 1) Tesla Node-proxy (server.js)
  - type: web
    name: tesla-node-proxy
    env: node
    plan: starter
    buildCommand: "npm ci"
    startCommand: "npm start"
    healthCheckPath: "/"
    envVars:
      - key: NODE_ENV
        value: production
      - key: TESLA_VCP_PROXY_BASE
        # <-- PÄIVITÄ kun VCP on deploattu ja sinulla on sen URL (alla syntyy esim. https://vcp-core.onrender.com)
        value: https://vcp-core.onrender.com
      # (valinnainen) salli suora VCP EU:hun, yleensä ei tarvetta:
      # - key: TESLA_ALLOW_DIRECT_VCP
      #   value: "false"

  # 2) Tesla Vehicle Command HTTP Proxy (teslamotors/vehicle-command)
  - type: web
    name: vcp-core
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile.vcp
    healthCheckPath: "/"
    autoDeploy: true
    envVars:
      - key: TESLA_PRIVATE_KEY_PEM
        sync: false   # syötä Renderin dashboardissa salainen PEM (ECDSA P-256)
